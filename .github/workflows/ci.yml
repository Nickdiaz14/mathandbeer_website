name: CI Tests

on:
  push:
    branches: [ main, Nico ]
  pull_request:
    branches: [ main, Nico ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Syntax check (py_compile)
      run: |
        python -m py_compile app.py main.py db.py boards.py
        python -m py_compile routes/pages.py routes/games.py routes/daily.py
        python -m py_compile routes/users.py routes/events.py routes/attendance.py routes/store.py

    - name: Run Tests
      env:
        # Variables de entorno vacías para que db.py no falle al importar
        DB_HOST: ""
        DB_NAME: ""
        DB_USER: ""
        DB_PASSWORD: ""
        DB_PORT: "5432"
      run: |
        python -m unittest discover -s tests -v
